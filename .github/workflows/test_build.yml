name: Lint & build

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        py_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            py_version: "3.10"
          - os: windows-latest
            py_version: "3.14"
          - os: macos-latest
            py_version: "3.10"
          - os: macos-latest
            py_version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.py_version }}
    - name: Install the project
      run: uv sync --locked --all-extras --dev
    - name: Lint
      if: always()
      run: |
        uv run ruff check
    - name: Check format
      if: always()
      run: |
        uv run ruff format --check
    - name: Typecheck
      if: always()
      run: |
        uv run ty check --error-on-warning
    - name: Run tests
      if: always()
      run: |
        uv run pytest --cov-report=xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set version
      run: |
        VERSION=$(./scripts/get_version.py)
        echo Setting version $VERSION
        uv version $VERSION
    - name: Build package
      run: |
        uv build
    - name: Save built package
      uses: actions/upload-artifact@v6
      with:
        name: package
        path: |
          dist

